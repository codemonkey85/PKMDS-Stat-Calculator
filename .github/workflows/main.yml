name: Deploy to GitHub Pages

# Run workflow on every push to the master branch
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to GitHub Pages
    # use ubuntu-latest image to run steps on
    runs-on: ubuntu-latest
    steps:
      # uses GitHub's checkout action to checkout code form the release branch
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      # sets up .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v5.0.0
        with:
          global-json-file: ./global.json

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore PkmdsStatCalculator/PkmdsStatCalculator.csproj

      # publishes Blazor project to the release-folder
      - name: Publish .NET Project
        run: dotnet publish PkmdsStatCalculator/PkmdsStatCalculator.csproj -c Release -o release --nologo

      # changes the base-tag in index.html from '/' to 'PKMDS-Stat-Calculator' to match GitHub Pages repository subdirectory
      - name: Change base-tag in index.html from / to PKMDS-Stat-Calculator
        run: sed -i 's/<base href="\/" \/>/<base href="\/PKMDS-Stat-Calculator\/" \/>/g' release/wwwroot/index.html

      # copy index.html to 404.html to serve the same file when a file is not found
      - name: copy index.html to 404.html
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      # add .nojekyll file to tell GitHub pages to not treat this as a Jekyll project. (Allow files and folders starting with an underscore)
      - name: Add .nojekyll file
        run: touch release/wwwroot/.nojekyll

      - name: Update version
        uses: datamonsters/replace-action@v2
        with:
          files: 'release/wwwroot/service-worker.published.js'
          replacements: '%%CACHE_VERSION%%=${{ github.run_id }}'

      - name: Commit wwwroot to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: release/wwwroot
